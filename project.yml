name: Pressed

# Generate the Xcode project with:   xcodegen generate

options:
  bundleIdPrefix: com.paradimn
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "7HDUY5Z87Z"
    BUNDLE_ID_BASE: com.paradimn.pressed
    APP_GROUP_ID: group.com.paradimn.pressed

targets:
  Pressed:
    type: application
    platform: iOS
    sources:
      - path: Pressed
      - path: Shared
    dependencies:
      - target: PressedShare
      - target: PressedWidget
    entitlements:
      path: Pressed/Pressed.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: Pressed/Info.plist
      properties:
        CFBundleDisplayName: Pressed
        PressedAppGroup: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - pressed
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(BUNDLE_ID_BASE).refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PressedShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PressedShare
      - path: Shared/AppGroup.swift
    entitlements:
      path: PressedShare/PressedShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: PressedShare/Info.plist
      properties:
        CFBundleDisplayName: Pressed
        PressedAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).share

  PressedWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PressedWidget
      - path: Shared/AppGroup.swift
      - path: Shared/Models.swift
      - path: Shared/Rules.swift
      - path: Pressed/Core/Persistence.swift
    entitlements:
      path: PressedWidget/PressedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: PressedWidget/Info.plist
      properties:
        CFBundleDisplayName: Pressed
        PressedAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widget

  PressedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PressedTests
    dependencies:
      - target: Pressed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).tests
        GENERATE_INFOPLIST_FILE: YES

  PressedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PressedUITests
    dependencies:
      - target: Pressed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pressed:
    build:
      targets:
        Pressed: all
        PressedTests: [test]
        PressedUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PressedTests
        - PressedUITests
